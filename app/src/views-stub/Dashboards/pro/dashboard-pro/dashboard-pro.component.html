<app-dashboard-layout [extraMenuItems]="MenuItems"
                      [activeView]="View"
                      [stats]="State.GetStats()"
                      (viewChanged)="Go($event)"
                      (supportClicked)="ShowSupport = true">

    <!-- Main Content -->
    <main class="main-content">
        @switch (View) {
        @case ('dashboard') { <div class="view-enter"><app-home-pro></app-home-pro></div> }
        @case ('opportunities') { <div class="view-enter"><app-opportunities [UserId]="User?.id || 0"></app-opportunities></div> }
        @case ('candidatures') { <div class="view-enter"><app-mandats /></div> }
        @case ('profil') { <div class="view-enter"><app-profil [IsImmoAidePopupOpen]="IsImmoAidePopupOpen"/></div> }
        @case ('messages') { <div class="view-enter"><app-message></app-message></div> }
        @case ('blog') { <div class="view-enter"><app-blog-admin></app-blog-admin></div> }
        @case ('diffusion') { <div class="view-enter"><app-email-broadcast></app-email-broadcast></div> }
        }
    </main>

</app-dashboard-layout>

<app-popup-support [(isOpen)]="ShowSupport" />

<!-- - cm - Lanceur du tutoriel Dashboard Pro (FAB "?" en bas a droite, visible uniquement quand le tutoriel n'est pas actif) -->
<app-crm-tutorial-launcher [Steps]="ProTutorialSteps" [DoneStorageKey]="ProTutorialDoneKey" [Title]="'Tutoriel Dashboard Pro'" [Icon]="'school'" [CurrentView]="View" />
