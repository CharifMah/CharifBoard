# Déploiement GitHub Pages du site Angular CharifBoard
# Build de app/ avec npm + Angular CLI, puis publication de dist/ sur Pages.
name: Deploy Angular app to Pages

on:
  # À chaque push sur main
  push:
    branches: ["main"]

  # Lancement manuel depuis l'onglet Actions
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement Pages à la fois
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build Angular (production)
        working-directory: app
        run: npm run build

      - name: SPA fallback (404.html = index.html)
        run: cp app/dist/charifboard-app/browser/index.html app/dist/charifboard-app/browser/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Résultat du build Angular
          path: app/dist/charifboard-app/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4